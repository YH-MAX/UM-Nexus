# Free pilot: both web services share the workspace's free instance-hour quota.
# Domains are added after ownership and DNS are confirmed; never put secrets here.
services:
  - type: web
    name: um-nexus-api
    runtime: docker
    plan: free
    dockerContext: ./apps/api
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: listing-images
      - key: ALLOWED_EMAIL_DOMAINS
        value: siswa.um.edu.my
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GLM_PROVIDER
        value: demo
      - key: ZAI_BASE_URL
        value: https://api.z.ai/api/paas/v4
      - key: ZAI_MODEL
        value: glm-4.6v
      - key: ZAI_TIMEOUT_SECONDS
        value: "60"
      - key: ZAI_MAX_RETRIES
        value: "2"
      - key: MAX_UPLOAD_FILE_SIZE_BYTES
        value: "5242880"

  - type: web
    name: um-nexus-web
    runtime: docker
    plan: free
    dockerContext: ./apps/web
    dockerfilePath: ./apps/web/Dockerfile
    # Public, generated by Next.js, and independent of Supabase session refresh.
    healthCheckPath: /manifest.webmanifest
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_ALLOWED_EMAIL_DOMAINS
        value: siswa.um.edu.my
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      # Leave time for the free API instance to wake up without retrying writes.
      - key: NEXT_PUBLIC_API_TIMEOUT_MS
        value: "90000"
      - key: NEXT_PUBLIC_E2E_AUTH
        value: "false"
      - key: SKIP_ENV_VALIDATION
        value: "false"
