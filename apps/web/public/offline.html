<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090807">
    <title>You're offline | UM Nexus</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #faf8f3; color: #1c1917; font: 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 420px; }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 28px; line-height: 1.2; }
      p { color: #57534e; }
      button, a { display: inline-block; padding: 12px 20px; border-radius: 8px; font: inherit; font-weight: 600; }
      button { border: 0; background: #b45309; color: white; cursor: pointer; }
      a { color: #92400e; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="UM Nexus">
      <h1>You're offline</h1>
      <p>Connect to the internet to browse current listings and use your UM Nexus account.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <a href="/trade">Marketplace</a>
    </main>
  </body>
</html>
